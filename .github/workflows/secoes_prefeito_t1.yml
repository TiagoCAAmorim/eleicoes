# 1º turno de prefeito por seção nas cidades com mais de 200 mil eleitores, 2008 a 2024 (etapa 6).
# Salva dados/historico/<ano>/prefeito_t1_secoes.csv.gz e prefeito_t1_votos.csv.gz no branch em que rodou.
name: secoes_prefeito_t1
on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos separados por espaço (vazio = 2008 2012 2016 2020 2024)"
        default: ""
  push:
    branches: ["claude/**"]
    paths:
      - scripts/tse_secoes_prefeito_t1.py
      - .github/workflows/secoes_prefeito_t1.yml
permissions:
  contents: write
concurrency:
  group: secoes-prefeito-t1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  anos:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.l.outputs.lista }}
    steps:
      - id: l
        env:
          ANOS: ${{ github.event.inputs.anos }}
        run: |
          A="${ANOS:-2008 2012 2016 2020 2024}"
          echo "lista=$(echo $A | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"
  ano:
    needs: anos
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        ano: ${{ fromJson(needs.anos.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Baixar e processar ${{ matrix.ano }}
        run: python scripts/tse_secoes_prefeito_t1.py ${{ matrix.ano }}
      - name: Salvar no branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A dados/historico/${{ matrix.ano }}
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -q -m "secoes_prefeito_t1: prefeito 1º turno por seção ${{ matrix.ano }} [skip ci]"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase -X theirs origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
