# Apuração ao vivo no Actions (alternativa ao loop no computador). Só manual: escolha a duração em minutos.
# Salva resultados/2026-presidente no branch em que foi disparado. Antes de reusar em outra eleição, ajuste
# scripts/apuracao.py (códigos da eleição e do cargo) e a pasta de resultados.
name: apuracao
on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Duração do loop em minutos (0 = uma rodada)"
        default: "340"
concurrency:
  group: apuracao
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  apuracao:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 20}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Loop de coleta e previsão
        env:
          MIN: ${{ github.event.inputs.minutos }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FIM=$(( $(date +%s) + ${MIN:-0} * 60 ))
          while true; do
            INI=$(date +%s)
            python scripts/apuracao.py || echo "rodada falhou"
            git add -A resultados/2026-presidente dados/2026 || true
            if ! git diff --cached --quiet; then
              git commit -q -m "apuracao: painel $(TZ=America/Sao_Paulo date +%H:%M) [skip ci]"
              for i in 1 2 3 4; do git pull -q --rebase -X theirs origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && break; sleep 5; done
            fi
            if grep -q '"pct_secoes": 100' resultados/2026-presidente/resultado.json 2>/dev/null; then echo "apuração concluída"; break; fi
            AGORA=$(date +%s)
            if [ $(( AGORA + 600 )) -ge $FIM ]; then break; fi
            sleep $(( 600 - (AGORA - INI) > 30 ? 600 - (AGORA - INI) : 30 ))
          done
