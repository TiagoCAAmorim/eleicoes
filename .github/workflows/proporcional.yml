# Votos dos cargos proporcionais por candidato e partido, 2006 a 2024 (etapa 7: quociente eleitoral e alianças).
# Salva dados/historico/<ano>/proporcional_*.csv.gz no branch em que rodou.
name: proporcional
on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos separados por espaço (vazio = 2006 2008 2010 2012 2014 2016 2018 2020 2022 2024)"
        default: ""
  push:
    branches: ["claude/**"]
    paths:
      - scripts/tse_proporcional.py
      - .github/workflows/proporcional.yml
permissions:
  contents: write
concurrency:
  group: proporcional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  anos:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.l.outputs.lista }}
    steps:
      - id: l
        env:
          ANOS: ${{ github.event.inputs.anos }}
        run: |
          A="${ANOS:-2006 2008 2010 2012 2014 2016 2018 2020 2022 2024}"
          echo "lista=$(echo $A | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"
  ano:
    needs: anos
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # não deixar 10 downloads grandes ao mesmo tempo no TSE
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        ano: ${{ fromJson(needs.anos.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Baixar e processar ${{ matrix.ano }}
        run: python scripts/tse_proporcional.py ${{ matrix.ano }}
      - name: Salvar no branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A dados/historico/${{ matrix.ano }}
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -q -m "proporcional: deputados e vereadores ${{ matrix.ano }} [skip ci]"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase -X theirs origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
