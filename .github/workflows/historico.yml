# Base histórica do TSE (etapa 2 do roteiro). Baixa os dados abertos de cada ano e salva dados/historico/<ano>
# no branch em que rodou. Roda à mão (escolha os anos) ou quando o script/workflow muda num push.
name: historico
on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos separados por espaço (vazio = 2006 a 2024)"
        default: ""
  push:
    branches: ["claude/**"]
    paths:
      - scripts/tse_historico.py
      - .github/workflows/historico.yml
permissions:
  contents: write
jobs:
  anos:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.l.outputs.lista }}
    steps:
      - id: l
        env:
          ANOS: ${{ github.event.inputs.anos }}
        run: |
          A="${ANOS:-2006 2008 2010 2012 2014 2016 2018 2020 2022 2024}"
          echo "lista=$(echo $A | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"
  ano:
    needs: anos
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        ano: ${{ fromJson(needs.anos.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Baixar e processar ${{ matrix.ano }}
        run: python scripts/tse_historico.py ${{ matrix.ano }}
      - name: Salvar no branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A dados/historico/${{ matrix.ano }}
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -q -m "historico: base TSE ${{ matrix.ano }} [skip ci]"
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
