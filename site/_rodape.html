<script>
(function () {
  var b = document.querySelector(".botao-cafe");
  if (!b) return;
  var aviso = document.querySelector(".cafe-aviso"), chave = b.getAttribute("data-pix"), t;
  function avisar(msg) { aviso.textContent = msg; clearTimeout(t); t = setTimeout(function () { aviso.textContent = ""; }, 4000); }
  function reserva() {
    var c = document.createElement("textarea");
    c.value = chave; c.setAttribute("readonly", ""); c.style.position = "absolute"; c.style.left = "-9999px";
    document.body.appendChild(c); c.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(c);
    avisar(ok ? "Chave Pix copiada. Obrigado!" : "Chave Pix: " + chave);
  }
  b.addEventListener("click", function () {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(chave).then(function () { avisar("Chave Pix copiada. Obrigado!"); }, reserva);
    } else { reserva(); }
  });
})();
</script>
